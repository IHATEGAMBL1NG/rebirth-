<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REBOOT // Personal Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #1e1f22;
      --card-bg: #2b2d31;
      --card-hover: #313338;
      --border-color: #3f4248;
      --text-main: #dbdee1;
      --text-muted: #949ba4;
      --accent-color: #5865f2;
      --accent-hover: #4752c4;
      --success-color: #23a55a;
      --danger-color: #f23f43;
      --warning-color: #f0b232;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* Экран входа */
    #authScreen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }

    .auth-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .auth-card h2 {
      color: #ffffff;
      margin-bottom: 8px;
    }

    .auth-card p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .auth-input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 12px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .auth-error {
      color: var(--danger-color);
      font-size: 0.8rem;
      margin-bottom: 12px;
      display: none;
    }

    /* Дашборд скрыт до входа */
    #dashboardScreen {
      display: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sync-status {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--warning-color);
    }

    .sync-status.online {
      color: var(--success-color);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-value {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .metric-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background-color: var(--bg-color);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--accent-color);
      width: 0%;
      transition: width 0.3s ease;
    }

    button {
      background-color: var(--card-hover);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background-color: var(--border-color);
      color: #ffffff;
    }

    button.primary {
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      width: 100%;
    }

    button.primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-group button.primary {
      width: auto;
    }

    button.danger {
      background-color: rgba(242, 63, 67, 0.1);
      color: var(--danger-color);
      border: 1px solid rgba(242, 63, 67, 0.3);
    }

    button.danger:hover {
      background-color: var(--danger-color);
      color: #ffffff;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .habits-list {
      list-style: none;
    }

    .habit-item {
      display: flex;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .habit-item:last-child {
      border-bottom: none;
    }

    .habit-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-color);
      margin-right: 12px;
      cursor: pointer;
    }

    .water-tracker {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .water-drop {
      flex: 1;
      height: 32px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .water-drop.active {
      background-color: #23a55a;
      border-color: #23a55a;
    }

    .journal-section {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      padding: 12px;
      font-size: 0.95rem;
      resize: vertical;
      margin-bottom: 12px;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .journal-entry {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }

    .entry-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <!-- Экран авторизации -->
  <div id="authScreen">
    <div class="auth-card">
      <h2>REBOOT</h2>
      <p>Личный доступ к системе</p>
      
      <input type="email" id="emailInput" class="auth-input" placeholder="Ваша почта (Email)">
      <input type="password" id="passwordInput" class="auth-input" placeholder="Пароль">
      
      <div id="authError" class="auth-error"></div>

      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <button class="primary" onclick="login()">Войти</button>
        <button style="width: 100%;" onclick="register()">Регистрация</button>
      </div>
    </div>
  </div>

  <!-- Главный Дашборд (скрыт до авторизации) -->
  <div id="dashboardScreen">
    <header>
      <div>
        <h1>REBOOT</h1>
        <div class="subtitle">Личная система трекинга и трансформации</div>
      </div>
      <div class="header-right">
        <div id="syncStatus" class="sync-status">Подключение...</div>
        <button style="padding: 4px 10px; font-size: 0.8rem;" onclick="logout()">Выйти</button>
      </div>
    </header>

    <div class="grid">
      <!-- Дни без ставок -->
      <div class="card">
        <div>
          <div class="card-title">Чистые дни</div>
          <div class="metric-value" id="cleanDays">0</div>
          <div class="metric-desc">Дней без казино и БК</div>
        </div>
        <div class="btn-group">
          <button class="primary" onclick="addCleanDay()">+1 День</button>
          <button class="danger" onclick="resetCleanDays()">Срыв</button>
        </div>
      </div>

      <!-- Цель на Екб -->
      <div class="card">
        <div>
          <div class="card-title">Цель: Екб</div>
          <div class="metric-value" id="savingsValue">0 ₽</div>
          <div class="progress-bar">
            <div class="progress-fill" id="savingsProgress"></div>
          </div>
          <div class="metric-desc" id="shiftsCount">Смен отработано: 0 (Цель: 120 000 ₽)</div>
        </div>
        <div class="btn-group">
          <button class="primary" onclick="addShift()">+1 Смена</button>
          <button onclick="removeShift()">-1</button>
        </div>
      </div>

      <!-- Водный баланс -->
      <div class="card">
        <div>
          <div class="card-title">Водный баланс</div>
          <div class="metric-desc">Цель: 8 стаканов в день</div>
          <div class="water-tracker" id="waterTracker">
            <div class="water-drop" onclick="toggleWater(0)"></div>
            <div class="water-drop" onclick="toggleWater(1)"></div>
            <div class="water-drop" onclick="toggleWater(2)"></div>
            <div class="water-drop" onclick="toggleWater(3)"></div>
            <div class="water-drop" onclick="toggleWater(4)"></div>
            <div class="water-drop" onclick="toggleWater(5)"></div>
            <div class="water-drop" onclick="toggleWater(6)"></div>
            <div class="water-drop" onclick="toggleWater(7)"></div>
          </div>
        </div>
        <div style="margin-top: 16px;">
          <button onclick="resetWater()">Сбросить воду</button>
        </div>
      </div>
    </div>

    <!-- Чек-лист привычек -->
    <div class="journal-section">
      <div class="card-title">Привычки на сегодня</div>
      <ul class="habits-list">
        <li class="habit-item">
          <input type="checkbox" id="h1" onchange="saveHabits()">
          <label for="h1">Стакан воды после пробуждения</label>
        </li>
        <li class="habit-item">
          <input type="checkbox" id="h2" onchange="saveHabits()">
          <label for="h2">Без кофеина натощак</label>
        </li>
        <li class="habit-item">
          <input type="checkbox" id="h3" onchange="saveHabits()">
          <label for="h3">Зарядка / растяжка 10 минут</label>
        </li>
        <li class="habit-item">
          <input type="checkbox" id="h4" onchange="saveHabits()">
          <label for="h4">Без захода в БК / казино</label>
        </li>
      </ul>
    </div>

    <!-- Дневник -->
    <div class="journal-section">
      <div class="card-title">Дневник & Мысли</div>
      <textarea id="journalInput" placeholder="Как прошла смена? Что на уме? Напиши пару строк..."></textarea>
      <button class="primary" style="width: auto;" onclick="addJournalEntry()">Сохранить запись</button>
      
      <div id="journalEntries" style="margin-top: 16px;"></div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDEvtnKd0Sr7Y-yLg4lzJeOCT07oradrMc",
      authDomain: "ihategambl1ng-rebirth.firebaseapp.com",
      projectId: "ihategambl1ng-rebirth",
      storageBucket: "ihategambl1ng-rebirth.firebasestorage.app",
      messagingSenderId: "667356577739",
      appId: "1:667356577739:web:12710a0312146e1f9a804e",
      measurementId: "G-7P6W76YH92"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let docUnsubscribe = null;
    let state = {
      cleanDays: 0,
      shifts: 0,
      water: [false, false, false, false, false, false, false, false],
      habits: [false, false, false, false],
      journal: []
    };

    const authScreen = document.getElementById('authScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const authError = document.getElementById('authError');
    const syncStatusEl = document.getElementById('syncStatus');

    // Следим за статусом входа
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authScreen.style.display = 'none';
        dashboardScreen.style.display = 'block';
        subscribeToData();
      } else {
        currentUser = null;
        if (docUnsubscribe) docUnsubscribe();
        authScreen.style.display = 'flex';
        dashboardScreen.style.display = 'none';
      }
    });

    // Регистрация
    window.register = async () => {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      authError.style.display = 'none';
      try {
        await createUserWithEmailAndPassword(auth, email, password);
      } catch (err) {
        authError.innerText = "Ошибка: " + err.message;
        authError.style.display = 'block';
      }
    };

    // Вход
    window.login = async () => {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      authError.style.display = 'none';
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        authError.innerText = "Ошибка входа: проверьте email/пароль";
        authError.style.display = 'block';
      }
    };

    // Выход
    window.logout = () => {
      signOut(auth);
    };

    // Слушатель данных из Firestore (привязан к UID юзера)
    function subscribeToData() {
      if (!currentUser) return;
      const docRef = doc(db, "users", currentUser.uid);

      docUnsubscribe = onSnapshot(docRef, (snapshot) => {
        if (snapshot.exists()) {
          state = snapshot.data();
          render();
          syncStatusEl.innerText = "● Синхронизировано";
          syncStatusEl.classList.add('online');
        } else {
          saveState();
        }
      }, (error) => {
        console.error("Ошибка базы:", error);
      });
    }

    async function saveState() {
      if (!currentUser) return;
      syncStatusEl.innerText = "Сохранение...";
      try {
        const docRef = doc(db, "users", currentUser.uid);
        await setDoc(docRef, state);
        syncStatusEl.innerText = "● Синхронизировано";
        syncStatusEl.classList.add('online');
      } catch (e) {
        console.error("Ошибка сохранения:", e);
      }
    }

    function render() {
      document.getElementById('cleanDays').innerText = state.cleanDays || 0;
      
      const shifts = state.shifts || 0;
      const savings = shifts * 6000;
      document.getElementById('savingsValue').innerText = savings.toLocaleString() + ' ₽';
      document.getElementById('shiftsCount').innerText = `Смен отработано: ${shifts} (Цель: 120 000 ₽)`;
      
      const progressPercent = Math.min(100, (savings / 120000) * 100);
      document.getElementById('savingsProgress').style.width = progressPercent + '%';

      // Water
      const drops = document.querySelectorAll('.water-drop');
      drops.forEach((drop, index) => {
        if (state.water && state.water[index]) {
          drop.classList.add('active');
        } else {
          drop.classList.remove('active');
        }
      });

      // Habits
      for (let i = 0; i < 4; i++) {
        document.getElementById(`h${i+1}`).checked = (state.habits && state.habits[i]) || false;
      }

      // Journal
      const journalContainer = document.getElementById('journalEntries');
      journalContainer.innerHTML = '';
      if (state.journal) {
        state.journal.forEach((entry) => {
          const div = document.createElement('div');
          div.className = 'journal-entry';
          div.innerHTML = `
            <div class="entry-date">${entry.date}</div>
            <div>${entry.text}</div>
          `;
          journalContainer.appendChild(div);
        });
      }
    }

    window.addCleanDay = () => { state.cleanDays = (state.cleanDays || 0) + 1; saveState(); };
    window.resetCleanDays = () => { if (confirm('Сбросить счетчик дней без ставок?')) { state.cleanDays = 0; saveState(); } };
    window.addShift = () => { state.shifts = (state.shifts || 0) + 1; saveState(); };
    window.removeShift = () => { if (state.shifts > 0) { state.shifts--; saveState(); } };
    window.toggleWater = (index) => { if (!state.water) state.water = Array(8).fill(false); state.water[index] = !state.water[index]; saveState(); };
    window.resetWater = () => { state.water = Array(8).fill(false); saveState(); };
    window.saveHabits = () => {
      if (!state.habits) state.habits = Array(4).fill(false);
      for (let i = 0; i < 4; i++) {
        state.habits[i] = document.getElementById(`h${i+1}`).checked;
      }
      saveState();
    };
    window.addJournalEntry = () => {
      const text = document.getElementById('journalInput').value.trim();
      if (!text) return;
      const now = new Date();
      const dateStr = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
      if (!state.journal) state.journal = [];
      state.journal.unshift({ date: dateStr, text: text });
      document.getElementById('journalInput').value = '';
      saveState();
    };
  </script>
</body>
</html>
